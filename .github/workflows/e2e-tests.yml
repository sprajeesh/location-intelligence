name: E2E Tests

on:
  workflow_call:

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@2d1c1198e79c30cca5c3957b1e3b65ce95b5356e
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@69b2dd252ee5a3ae9d2f38e3b402b037b4c4170c
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: 3.13

      - name: Install node dependencies
        run: cd apps/web && pnpm install

      - name: Install Playwright browsers
        run: cd apps/web && pnpm exec playwright install --with-deps chromium

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: cd apps/api && uv sync

      - name: Prepare tiny OSRM dataset for CI
        run: |
          mkdir -p osrm-data
          cp docker/data/fixtures/ci-sample.osm osrm-data/new-zealand-latest.osm
          docker run --rm -v "$PWD/osrm-data:/data" osrm/osrm-backend osrm-extract -p /opt/car.lua /data/new-zealand-latest.osm
          docker run --rm -v "$PWD/osrm-data:/data" osrm/osrm-backend osrm-partition /data/new-zealand-latest.osrm
          docker run --rm -v "$PWD/osrm-data:/data" osrm/osrm-backend osrm-customize /data/new-zealand-latest.osrm

      - name: Start API dependencies (PostgreSQL, Redis, OSRM) via Docker
        run: docker compose up -d --wait --wait-timeout 180 postgis redis osrm
        env:
          DB_USER: gisuser
          DB_PASSWORD: changeme
          # The real ~100MB LINZ address export isn't committed to git (see
          # .gitignore); CI builds postgis against the small fixture instead.
          ADDRESS_DATA_ZIP: docker/data/fixtures/ci-sample-addresses-CSV.zip

      - name: Run database migrations
        run: cd apps/api && uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql://gisuser:changeme@localhost:5432/gis

      - name: Start FastAPI service
        run: cd apps/api && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        env:
          DATABASE_URL: postgresql://gisuser:changeme@localhost:5432/gis
          REDIS_URL: redis://localhost:6379
          OSRM_URL: http://localhost:5000
          LINZ_API_KEY: test-key
          API_SHARED_SECRET: test-secret

      - name: Wait for FastAPI service to be ready
        shell: bash
        run: |
          echo "Waiting for http://localhost:8000/health to be ready..."
          DEADLINE=$((SECONDS + 120))
          until curl -sf http://localhost:8000/health > /dev/null 2>&1; do
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "Timeout waiting for API to be ready" >&2
              exit 1
            fi
            echo "API not ready yet, retrying in 2s..."
            sleep 2
          done
          echo "API is ready!"

      - name: Run E2E smoke tests (all branches)
        if: github.ref != 'refs/heads/main'
        run: cd apps/web && pnpm test:e2e:smoke
        continue-on-error: false
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Run full E2E suite (main branch only)
        if: github.ref == 'refs/heads/main'
        run: cd apps/web && pnpm test:e2e
        continue-on-error: false
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: apps/web/test-results
          retention-days: 5

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 5
