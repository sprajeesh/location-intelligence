name: CI/CD
on: [push]

jobs:
  test:
    name: Lint, Unit Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@2d1c1198e79c30cca5c3957b1e3b65ce95b5356e
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@69b2dd252ee5a3ae9d2f38e3b402b037b4c4170c
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: 3.13

      - name: Install node dependencies
        run: cd apps/web && pnpm install

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: cd apps/api && uv sync

      - name: Run linters
        run: cd apps/web && pnpm run lint && cd ../api && uv run ruff check . && uv run ruff format --check .

      - name: Run unit and integration tests
        run: cd apps/web && pnpm test && cd ../api && uv run pytest

      - name: Build
        run: pnpm run build:web

  security-scan:
    name: Security Scan
    needs: [test]
    uses: ./.github/workflows/security-scan.yml
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  e2e-tests:
    name: E2E Tests
    needs: [test]
    uses: ./.github/workflows/e2e-tests.yml

  # ───────────────────────────────────────────────────────────────────────────
  # Deploy the API + PostGIS + Redis + OSRM to the app VM via docker-compose.
  # No provider-specific IaC here on purpose: the VM is provisioned manually
  # once, and this step only needs an SSH host/key -- so moving providers
  # later (e.g. AWS/Azure) is just a secret-value change, not a workflow
  # rewrite. See DEPLOY_SERVER_HOST/DEPLOY_SSH_KEY secrets.
  #
  # DEPLOY_SERVER_HOST_KEY pins the VM's SSH host key (captured once,
  # out-of-band, via `ssh-keyscan -H <ip>`) so StrictHostKeyChecking=yes
  # below validates against a trusted value instead of trust-on-first-use --
  # running ssh-keyscan against SERVER_HOST at deploy time would silently
  # trust whatever key is presented on that connection, which is exactly
  # what an on-path attacker during a CI run would want.
  # ───────────────────────────────────────────────────────────────────────────
  deploy-api:
    name: Deploy API to VM
    needs: [test, security-scan, e2e-tests]
    if: |
      github.ref == 'refs/heads/main' &&
      (startsWith(github.event.head_commit.message, 'release:') ||
       startsWith(github.event.head_commit.message, 'chore(main): release '))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Pin server host key
        shell: bash
        env:
          SERVER_HOST_KEY: ${{ secrets.DEPLOY_SERVER_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync repo and restart services
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.DEPLOY_SERVER_HOST }}
          APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          GIT_SHA: ${{ github.sha }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          API_SHARED_SECRET: ${{ secrets.API_SHARED_SECRET }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          LINZ_API_KEY: ${{ secrets.LINZ_API_KEY }}
        run: |
          # Base64 first: the heredoc below is re-parsed as shell syntax on
          # arrival at the remote end, so embedding the raw secret values in
          # it directly would let quote/backtick/$() characters in a secret
          # break out of their quoting there. Base64 text can't do that, and
          # decoding happens inside fetch-secrets.sh via stdin -- never as a
          # command-line argument -- so the plaintext never appears in that
          # process's argv either (see scripts/fetch-secrets.sh).
          DB_USER_B64=$(printf '%s' "$DB_USER" | base64 -w0)
          DB_PASSWORD_B64=$(printf '%s' "$DB_PASSWORD" | base64 -w0)
          API_SHARED_SECRET_B64=$(printf '%s' "$API_SHARED_SECRET" | base64 -w0)
          REDIS_PASSWORD_B64=$(printf '%s' "$REDIS_PASSWORD" | base64 -w0)
          LINZ_API_KEY_B64=$(printf '%s' "$LINZ_API_KEY" | base64 -w0)

          ssh -o StrictHostKeyChecking=yes "ubuntu@$SERVER_HOST" bash -s <<REMOTE
            set -euo pipefail

            echo "==> Ensuring app directory exists"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/sprajeesh/location-intelligence.git "$APP_DIR"
            fi
            cd "$APP_DIR"

            echo "==> Checking out the exact commit that was tested"
            git fetch --all --prune
            git checkout --detach "$GIT_SHA"

            echo "==> Writing .env"
            printf '%s\n%s\n%s\n%s\n%s\n' "$DB_USER_B64" "$DB_PASSWORD_B64" "$API_SHARED_SECRET_B64" "$REDIS_PASSWORD_B64" "$LINZ_API_KEY_B64" | bash scripts/fetch-secrets.sh .env

            echo "==> Ensuring OSRM datasets exist for all profiles (driving/walking/cycling)"
            # Idempotent: skips download/extract/partition/customize steps whose
            # output file already exists, so this is a no-op on most deploys and
            # only does real work the first time a new profile is introduced (as
            # it will be on the first deploy after this change -- expect ~15
            # extra minutes for the one-time PBF download+extract).
            bash scripts/setup-osrm.sh

            echo "==> Rebuilding and restarting all services"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull --quiet || true
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans

            echo "==> Services status"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps

            echo "==> Deploy complete"
          REMOTE

      - name: Verify deployment health
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.DEPLOY_SERVER_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=yes "ubuntu@$SERVER_HOST" bash -s <<'REMOTE'
            set -uo pipefail

            DEADLINE=$((SECONDS + 120))
            STATUS=""
            until [ "$STATUS" = "ok" ]; do
              if [ "$SECONDS" -ge "$DEADLINE" ]; then
                echo "API health check failed: status not \"ok\" within 120s (last status: ${STATUS:-none})" >&2
                exit 1
              fi
              STATUS=$(curl -sf --max-time 5 http://localhost:8000/health | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])" 2>/dev/null || true)
              if [ "$STATUS" != "ok" ]; then
                echo "API not ready yet (status: ${STATUS:-none}), retrying in 5s..."
                sleep 5
              fi
            done
            echo "API health check passed"

            # osrm-routed has no real /health route, so "any HTTP response at
            # all" (even a 400/404) is proof the daemon is up and serving that
            # profile's dataset -- same check scripts/diagnose.sh uses locally.
            # This is what catches a profile whose dataset failed to extract:
            # driving/walking/cycling each run as a physically separate
            # osrm-routed process, so one missing dataset only takes down its
            # own profile while the others (and the api container above) stay
            # healthy -- exactly the silent-partial-failure this check exists
            # to surface as a loud deploy failure instead.
            check_osrm() {
              local name="$1" port="$2"
              local deadline=$((SECONDS + 60))
              until curl -s -o /dev/null --max-time 3 "http://localhost:$port/"; do
                if [ "$SECONDS" -ge "$deadline" ]; then
                  echo "OSRM ($name, port $port) health check failed: no response within 60s -- dataset likely missing or extraction failed, check the setup-osrm.sh output above" >&2
                  exit 1
                fi
                echo "OSRM ($name, port $port) not ready yet, retrying in 5s..."
                sleep 5
              done
              echo "OSRM ($name, port $port) health check passed"
            }
            check_osrm "driving" 5000
            check_osrm "walking" 5001
            check_osrm "cycling" 5002
          REMOTE

  # ───────────────────────────────────────────────────────────────────────────
  # Deploy the Next.js web app to Cloudflare (Workers, via OpenNext). No
  # dependency on the API VM, so this runs independently/in parallel with deploy-api.
  # ───────────────────────────────────────────────────────────────────────────
  deploy-web:
    name: Deploy Web to Cloudflare
    needs: [test, security-scan, e2e-tests]
    if: |
      github.ref == 'refs/heads/main' &&
      (startsWith(github.event.head_commit.message, 'release:') ||
       startsWith(github.event.head_commit.message, 'chore(main): release '))
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.PROD_API_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@2d1c1198e79c30cca5c3957b1e3b65ce95b5356e
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@69b2dd252ee5a3ae9d2f38e3b402b037b4c4170c
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install node dependencies
        run: pnpm install

      - name: Build for Cloudflare (OpenNext)
        run: pnpm run build:cf

      - name: Deploy via Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

      # Server-only secret the BFF Route Handlers send as X-Internal-Api-Key
      # (see src/utils/apiAuth.ts) -- set via `wrangler secret put`, not
      # NEXT_PUBLIC_*, so it never ends up in the client bundle. Must run
      # after the Worker exists (first deploy above creates it).
      - name: Set API shared secret on the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_SHARED_SECRET: ${{ secrets.API_SHARED_SECRET }}
        run: echo "$API_SHARED_SECRET" | pnpm exec wrangler secret put API_SHARED_SECRET
