name: Release Please

on:
  workflow_run:
    workflows: ["CI/CD"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Release a new version"
        required: false
        default: false
        type: boolean
      branch:
        description: "Branch to release from"
        required: false
        default: "main"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  # Refreshes the per-component version-bump/changelog PR, or tags + creates
  # the GitHub Release if the pending PR was just merged. Gated to
  # release: merges (see push.yml's deploy jobs) plus release-please's own
  # PR-merge commits ("chore(main): release ...") so the second run --
  # the one that actually cuts the release -- can fire itself.
  release-please-pr:
    name: Update release PRs
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
        (startsWith(github.event.workflow_run.head_commit.message, 'release:') ||
          startsWith(github.event.workflow_run.head_commit.message, 'chore(main): release ')))
    steps:
      - name: Checkout repository
        uses: actions/checkout@2d1c1198e79c30cca5c3957b1e3b65ce95b5356e  # v4.2.2

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          # RELEASE_PLEASE_TOKEN must be a PAT (not GITHUB_TOKEN, which can't
          # re-trigger downstream workflows) with these scopes:
          #   Contents: Read and write, Pull requests: Read and write,
          #   Actions: Read-only
          # The Actions scope isn't documented by release-please-action but is
          # required — without it the API rejects the token with "Resource not
          # accessible by personal access token" and the action fails silently
          # before opening a PR or cutting a tag. See:
          # https://github.com/googleapis/release-please-action/issues/1048
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Get the output
        run: echo "$RELEASE_OUTPUT"
        env:
          RELEASE_OUTPUT: ${{ toJson(steps.release.outputs) }}

    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      html_url: ${{ steps.release.outputs['web--html-url'] || steps.release.outputs['api--html-url'] }}
      tag_name: ${{ steps.release.outputs['web--tag-name'] || steps.release.outputs['api--tag-name'] }}
