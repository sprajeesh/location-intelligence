# Production overlay -- combined with the base docker-compose.yml via:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Kept separate from docker-compose.yml so local dev (which runs FastAPI
# directly on the host, per AGENTS.md) is unaffected by the api service
# added here.
services:
  api:
    build:
      context: apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Only reachable on the VM itself now (used by the CI health check and
      # by Caddy, below) -- public traffic comes in through Caddy on 443.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend
      - proxy

  postgis:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  osrm:
    restart: unless-stopped

  # TLS-terminating reverse proxy in front of the api service -- Cloudflare
  # Workers (the web BFF) can't reliably fetch() a custom port in production,
  # and .env.example already requires HTTPS on a real hostname for
  # NEXT_PUBLIC_API_URL. See docker/Caddyfile for the hostname (sslip.io,
  # no owned domain needed) -- Caddy handles Let's Encrypt automatically.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - proxy

volumes:
  caddy-data:
  caddy-config:

networks:
  proxy:
