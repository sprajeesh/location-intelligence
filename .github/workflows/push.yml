name: CI/CD
on: [push]

jobs:
  test:
    name: Test and Security Scan
    runs-on: ${{ matrix.os }}
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [24]
        python-version: [3.13]
    steps:
      - name: Checkout code
        uses: actions/checkout@2d1c1198e79c30cca5c3957b1e3b65ce95b5356e
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@69b2dd252ee5a3ae9d2f38e3b402b037b4c4170c
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install node dependencies
        run: cd apps/web && pnpm install

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: cd apps/api && uv sync

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Run linters
        run: cd apps/web && pnpm run lint && cd ../api && uv run ruff check . && uv run ruff format --check .

      - name: Run tests
        run: cd apps/web && pnpm test && cd ../api && uv run pytest

      # - name: Run security scan
      #   run: snyk test --severity-threshold=high --all-projects

      # - name: Run snyk monitor
      #   if: github.ref == 'refs/heads/main'
      #   run: snyk monitor --all-projects

      # - name: Build
      #   run: pnpm run build:web

  # ───────────────────────────────────────────────────────────────────────────
  # Provision/update OCI infrastructure via Terraform. Idempotent -- a no-op
  # plan+apply when infra/oci/** hasn't changed. Runs before deploy-api so the
  # VM is guaranteed to exist. See infra/oci/README.md for one-time setup.
  # ───────────────────────────────────────────────────────────────────────────
  terraform:
    name: Provision OCI Infrastructure
    needs: [test]
    if: |
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    environment: production
    outputs:
      instance_ip: ${{ steps.tf_outputs.outputs.instance_ip }}
      db_user: ${{ steps.tf_outputs.outputs.db_user }}
      db_password_secret_id: ${{ steps.tf_outputs.outputs.db_password_secret_id }}
    env:
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
      TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
      TF_VAR_oci_private_key_pem: ${{ secrets.OCI_PRIVATE_KEY }}
      TF_VAR_region: ${{ secrets.OCI_REGION }}
      TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
      TF_VAR_ssh_public_key: ${{ secrets.DEPLOY_SSH_PUBLIC_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@2d1c1198e79c30cca5c3957b1e3b65ce95b5356e
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: Terraform Init
        working-directory: infra/oci
        run: |
          terraform init \
            -backend-config="endpoint=${{ secrets.OCI_S3_ENDPOINT }}" \
            -backend-config="access_key=${{ secrets.OCI_S3_ACCESS_KEY }}" \
            -backend-config="secret_key=${{ secrets.OCI_S3_SECRET_KEY }}"

      - name: Terraform Plan
        working-directory: infra/oci
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply (retries on OCI capacity errors)
        working-directory: infra/oci
        run: ./scripts/apply-with-retry.sh tfplan

      - name: Export outputs
        id: tf_outputs
        working-directory: infra/oci
        run: |
          echo "instance_ip=$(terraform output -raw instance_public_ip)" >> "$GITHUB_OUTPUT"
          echo "db_user=$(terraform output -raw db_user)" >> "$GITHUB_OUTPUT"
          echo "db_password_secret_id=$(terraform output -raw db_password_secret_id)" >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────────────
  # Deploy the API + PostGIS + Redis + OSRM to the OCI VM via docker-compose.
  # ───────────────────────────────────────────────────────────────────────────
  deploy-api:
    name: Deploy API to OCI VM
    needs: [terraform]
    if: |
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        shell: bash
        env:
          SERVER_HOST: ${{ needs.terraform.outputs.instance_ip }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Sync repo and restart services
        shell: bash
        env:
          SERVER_HOST: ${{ needs.terraform.outputs.instance_ip }}
          APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          GIT_SHA: ${{ github.sha }}
          DB_USER: ${{ needs.terraform.outputs.db_user }}
          DB_PASSWORD_SECRET_ID: ${{ needs.terraform.outputs.db_password_secret_id }}
          API_SHARED_SECRET: ${{ secrets.API_SHARED_SECRET }}
        run: |
          ssh -o StrictHostKeyChecking=yes "ubuntu@$SERVER_HOST" bash -s <<REMOTE
            set -euo pipefail

            echo "==> Ensuring app directory exists"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/sprajeesh/location-intelligence.git "$APP_DIR"
            fi
            cd "$APP_DIR"

            echo "==> Checking out the exact commit that was tested"
            git fetch --all --prune
            git checkout --detach "$GIT_SHA"

            echo "==> Fetching DB secrets from OCI Vault"
            bash scripts/fetch-secrets.sh "$DB_USER" "$DB_PASSWORD_SECRET_ID" "$API_SHARED_SECRET" .env

            echo "==> Rebuilding and restarting all services"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull --quiet || true
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans

            echo "==> Services status"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps

            echo "==> Deploy complete"
          REMOTE

      - name: Verify deployment health
        shell: bash
        env:
          SERVER_HOST: ${{ needs.terraform.outputs.instance_ip }}
        run: |
          sleep 15
          ssh -o StrictHostKeyChecking=yes "ubuntu@$SERVER_HOST" \
            'STATUS=$(curl -sf http://localhost:8000/health | python3 -c "import sys,json; print(json.load(sys.stdin)[\"status\"])"); \
             if [ "$STATUS" = "ok" ]; then echo "API health check passed"; else echo "API health check failed (status: $STATUS)"; exit 1; fi'

  # ───────────────────────────────────────────────────────────────────────────
  # Deploy the Next.js web app to Cloudflare (Workers, via OpenNext). No OCI
  # dependency, so this runs independently/in parallel with terraform+deploy-api.
  # ───────────────────────────────────────────────────────────────────────────
  deploy-web:
    name: Deploy Web to Cloudflare
    needs: [test]
    if: |
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.PROD_API_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@2d1c1198e79c30cca5c3957b1e3b65ce95b5356e
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@69b2dd252ee5a3ae9d2f38e3b402b037b4c4170c
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install node dependencies
        run: pnpm install

      - name: Build for Cloudflare (OpenNext)
        run: pnpm run build:cf

      - name: Deploy via Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy

      # Server-only secret the BFF Route Handlers send as X-Internal-Api-Key
      # (see src/utils/apiAuth.ts) -- set via `wrangler secret put`, not
      # NEXT_PUBLIC_*, so it never ends up in the client bundle. Must run
      # after the Worker exists (first deploy above creates it).
      - name: Set API shared secret on the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_SHARED_SECRET: ${{ secrets.API_SHARED_SECRET }}
        run: echo "$API_SHARED_SECRET" | pnpm exec wrangler secret put API_SHARED_SECRET
