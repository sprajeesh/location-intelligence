name: Release Please

on:
  push:
    branches: [main]

jobs:
  # Keeps a per-component version-bump/changelog PR up to date on every push
  # to main. Never tags or creates a GitHub Release -- safe to run
  # unconditionally.
  release-please-pr:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    name: Update release PRs
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          target-branch: main
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  # Tags + creates the GitHub Release for any component whose release PR has
  # already been merged (version bumped in the manifest) but not yet tagged.
  # Gated on the same condition as deploy-api/deploy-web in push.yml so a
  # version is only ever "released" in lockstep with an actual production
  # deploy, not whenever the release-please PR happened to get merged.
  release-please-tag:
    permissions:
      contents: write
    name: Tag + release on production deploy
    runs-on: ubuntu-latest
    if: startsWith(github.event.head_commit.message, 'release:')
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          target-branch: main
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
