services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - backend

  postgis:
    build:
      context: .
      dockerfile: docker/Dockerfile.postgis
      args:
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/15/main
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d gis"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - backend

  osrm:
    image: osrm/osrm-backend
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld /data/new-zealand-latest.osrm
    healthcheck:
      test: ["CMD-SHELL", "grep -q osrm-routed /proc/1/cmdline || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - backend

volumes:
  redis-data:
  postgis-data:

# api (in docker-compose.prod.yml) joins backend to reach these services, plus
# proxy so caddy can reach it -- caddy itself only joins proxy, so it has no
# route to postgis/redis/osrm.
networks:
  backend:
